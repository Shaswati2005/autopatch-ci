name: Deploy Backend Service to Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: autopatch-backend-service
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/autopatch-backend:latest

jobs:
  deploy-backend:
    name: Deploy Python FastAPI Backend Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Backend Container Image
        run: |
          docker build -t $IMAGE_NAME ./backend
          docker push $IMAGE_NAME

      - name: Deploy Backend Service to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}",VERIFICATION_STRATEGY="cloud_build"
