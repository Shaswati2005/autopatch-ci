name: AutoPatch-CI Build & Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Type Check & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings requests httpx pytest pytest-asyncio ruff mypy

      - name: Run Ruff Linter
        run: |
          PYTHONPATH=backend/src ruff check backend/src backend/tests

      - name: Run Mypy Type Checker
        run: |
          PYTHONPATH=backend/src mypy backend/src

      - name: Execute Pytest Suite
        run: |
          PYTHONPATH=backend/src python -m pytest backend/tests --verbose

  frontend-test:
    name: Frontend Lint, Type Check & Vitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Next.js Type Check & Build
        working-directory: ./frontend
        run: npm run build

      - name: Execute Vitest Suite
        working-directory: ./frontend
        run: npm test

  docker-build-check:
    name: Verify Container Build Deployment Artifacts
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: autopatch-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: autopatch-frontend:ci-check

  # ── AutoPatch-CI Notification ────────────────────────────────────────────
  # Fires when ANY job above fails.  Sends a structured failure event to
  # the AutoPatch-CI backend so it can diagnose and open a fix PR.
  notify-autopatch:
    name: Notify AutoPatch-CI on Failure
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: failure()

    steps:
      - name: Send CI failure event to AutoPatch-CI
        env:
          AUTOPATCH_WEBHOOK_URL: ${{ secrets.AUTOPATCH_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$AUTOPATCH_WEBHOOK_URL" ]; then
            echo "AUTOPATCH_WEBHOOK_URL secret not set – skipping notification"
            exit 0
          fi

          curl -s -X POST "$AUTOPATCH_WEBHOOK_URL/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -d '{
              "repo":          "${{ github.repository }}",
              "branch":        "${{ github.ref_name }}",
              "commit_sha":    "${{ github.sha }}",
              "workflow_name": "${{ github.workflow }}",
              "run_id":        "${{ github.run_id }}",
              "run_url":       "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "failed_jobs":   ["backend-test", "frontend-test"]
            }' \
            --max-time 10 || echo "AutoPatch-CI webhook call failed (non-fatal)"

