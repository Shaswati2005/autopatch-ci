[tool.poetry]
name = "autopatch-ci"
version = "0.1.0"
description = "Autonomous DevOps CI/CD Repair & Self-Healing Agent powered by Gemini & Google ADK"
authors = ["AutoPatch Team <dev@autopatch.io>"]
readme = "README.md"
packages = [{include = "autopatch", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11 || ^3.12 || ^3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
google-genai = "^0.1.1"
requests = "^2.31.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.3.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["autopatch"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
    "pass"
]
show_missing = true
fail_under = 100

